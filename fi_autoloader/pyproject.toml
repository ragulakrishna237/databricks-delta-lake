[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fi-autoloader"
version = "0.1.0"
description = "Synthetic Fixed Income Auto Loader pipeline helpers (Security Master + Holding Master ingest)."
requires-python = ">=3.11"
dependencies = [
  "pyspark==3.5.3",
  "delta-spark==3.2.1",
  "pyyaml>=6.0",
]

[tool.setuptools.packages.find]
where = ["src"]
